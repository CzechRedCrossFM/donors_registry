services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: '2048'
    ports:
      - '127.0.0.1:1433:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    entrypoint: ['/opt/mssql-tools18/bin/sqlcmd']
    command: ['-S', 'db', '-U', 'sa', '-C', '-b', '-Q', "IF DB_ID('donors') IS NULL CREATE DATABASE donors COLLATE Czech_100_CI_AS_SC_UTF8; ALTER DATABASE donors SET ALLOW_SNAPSHOT_ISOLATION ON;"]
volumes:
  mssql-data:
